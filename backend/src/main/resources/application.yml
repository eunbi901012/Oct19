spring:
  application:
    name: oct19
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
mybatis:
  configuration:
    call-setters-on-nulls: true
server:
  port: ${SERVER_PORT:8080}
