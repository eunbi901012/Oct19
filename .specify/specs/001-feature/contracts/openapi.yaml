openapi: 3.0.3
info:
  title: oct19 공통 관리 REST 계약
  version: 0.1.0
  description: 동기 imperative/blocking MyBatis 설계. 400/401/403·DTO 명명은 기술 제안이다. 정책 미확인 OQ는 승인으로 취급하지 않으며 구현 착수 시 해결해야 한다. source_id와
    canonical_id를 분리한다.
servers:
- url: http://localhost:8080
  description: 로컬 Compose backend 포트 설계 제안
tags:
- name: 공통 관리
  description: 사용자·조직·역할·메뉴·코드
security:
- bearerAuth: []
paths:
  /api/users:
    get:
      operationId: searchUsers
      summary: 사용자 관리 조회
      x-related-requirements:
      - REQ-001
      - REQ-002
      - REQ-003
      - REQ-037
      - REQ-049
      x-implementation-constraints:
      - canonical_id: REQ-037
        description: 이 조회와 /admin/users의 연동 실행은 spring_boot 3.3.x, node 20.x, vite 5.x, react 18.x, postgres 16.x의 Version BOM을 따른다. 패치 버전은 OQ-TECH-001이며 응답에 버전 필드를 추가하지 않는다.
        source: requirement-registry.json의 REQ-037 statement 및 source_locator (SPEC-REQUEST.md:104)
      - canonical_id: REQ-049
        description: preview 또는 quickstart에서 이 API의 조회 결과와 /admin/users의 표시 결과를 함께 검증한다. API 응답 성공만으로 화면 검증 완료를 주장하지 않는다.
        source: requirement-registry.json의 REQ-049 statement 및 source_locator (SPEC-REQUEST.md:131)
      x-required-tests:
      - 'compatibility: REQ-037의 BOM으로 구성한 실행 환경에서 교번 조건으로 searchUsers 호출 -> 200, success=true이며 /admin/users에 같은 employee_number의 행이 표시된다. BOM의 각 버전 일치 여부는 별도 의존성·이미지 검사로 확인한다'
      - 'integration: preview 또는 quickstart에서 /admin/users에 교번 조건을 입력해 검색 -> GET /api/users 응답 data와 화면의 employee_number/person_name/position/retired_on/last_synced_at가 동일하다(REQ-049)'
      parameters:
      - in: query
        name: page
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: size
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: employee_number
        description: 교번 조회 조건
        schema:
          type: string
      - in: query
        name: person_name
        description: 성명 조회 조건
        schema:
          type: string
      - in: query
        name: organization_code
        description: 소속 조회 조건
        schema:
          type: string
      - in: query
        name: job_grade
        description: 직급 조회 조건
        schema:
          type: string
      - in: query
        name: employment_status
        description: 재직상태 조회 조건
        schema:
          type: string
      - in: query
        name: business_roles
        description: 역할 조회 조건
        schema:
          type: string
      - in: query
        name: enabled
        description: 사용여부 조회 조건
        schema:
          type: boolean
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 정상 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/User'
                    pagination:
                      $ref: '#/components/schemas/PageMeta'
                  required:
                  - data
                  - pagination
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 부재 또는 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 허용되지 않은 접근
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-filtering-status: 원문 조건 외 ID 선택은 편집 대상 식별을 위한 설계 제안. 조건 조합 방식·기본 정렬·page/size 기본값은 확인 필요. page/size는 기술 제안으로 명시 전달한다.
      security:
      - bearerAuth: []
      x-roles:
      - 'OQ-AUTH-001: 관리 권한 보유자(역할 코드 승인 대기)'
      x-authorization-status: 설계 제안; 실제 인증·역할 코드·scope는 OQ-AUTH-001 승인 필요
    put:
      operationId: updateUserSettings
      summary: 사용자 관리 저장
      x-related-requirements:
      - REQ-003
      - REQ-004
      - REQ-034
      x-implementation-constraints:
      - canonical_id: REQ-034
        description: users.enabled 저장과 후속 searchUsers 재조회는 PostgreSQL 영속성을 사용한다. PostgreSQL 선택은 실행 제약이며 새로운 업무 동작이나 DB 관리 API를 뜻하지 않는다.
        source: requirement-registry.json의 REQ-034 statement 및 source_locator (SPEC-REQUEST.md:80)
      x-state-transitions:
      - users.enabled의 기존 boolean 값 -> 요청한 boolean 값 저장(REQ-003). 사용중지에 따른 접속 차단 정책은 OQ-DATA-002이며 비활성 정책으로 단정하지 않는다.
      x-business-rules:
      - 인사 원천 필드 employee_number/person_name/organization_code/job_grade/employment_status/position/retired_on/last_synced_at는
        수정 요청에서 거부한다(REQ-004).
      - 사용여부만 로컬 설정으로 변경한다. 업무 역할 변경은 saveUserRoleAssignment가 담당한다(REQ-003).
      x-side-effects:
      - users.enabled를 갱신한다. 인사 원천 컬럼은 기존 값으로 남는다.
      x-required-tests:
      - 'happy: 기존 user_id와 변경할 enabled 전송 -> 후속 searchUsers에서 users.enabled가 변경값이다'
      - 'auth: 승인 후 실효 거부로 결정된 주체가 /api/users에 저장 요청 -> 403, users 변경 없음 (OQ-AUTH-001 선행)'
      - 'validation: person_name을 수정 본문에 포함 -> 400 field_errors.field=person_name이고 users.person_name은 불변'
      - 'business: KORUS employee_number 변경 시도 -> 400 및 users.employee_number 기존값 유지(REQ-004)'
      - 'persistence: PostgreSQL에 존재하는 user_id의 enabled를 변경한 뒤 독립 DB 연결과 searchUsers로 재조회 -> users.enabled와 응답 enabled가 제출값이며 원천 employee_number는 기존값이다(REQ-034, REQ-003, REQ-004)'
      - 'side-effect: users.enabled를 갱신한다. 인사 원천 컬럼은 기존 값으로 남는다. -> DB snapshot과 후속 조회로 해당 필드 및 비간섭 테이블을 비교한다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: 정상 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
                  required:
                  - data
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 부재 또는 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 허용되지 않은 접근
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 저장 대상 식별자를 본문에 전달하는 동기 저장 설계다. 기존 식별자는 선택 응답에서 전달하고, 신규 역할 부여·메뉴 설정의 opaque ID는 frontend 내부 UUID로 생성·재시도
        보존한다. 승인자 검증·선택 대상 조합은 관련 OQ가 해결되어야 한다. 아래 required와 400/401/403 및 ID 생성은 기술 계약 제안이다.
      security:
      - bearerAuth: []
      x-roles:
      - 'OQ-AUTH-001: 관리 권한 보유자(역할 코드 승인 대기)'
      x-authorization-status: 설계 제안; 실제 인증·역할 코드·scope는 OQ-AUTH-001 승인 필요
  /api/organizations:
    get:
      operationId: getOrganizationRelations
      summary: 조직 관리 조회
      x-related-requirements:
      - REQ-005
      parameters:
      - in: query
        name: page
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: size
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: organization_code
        description: 조직코드 조회 조건
        schema:
          type: string
      responses:
        '200':
          description: 정상 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Organization'
                    pagination:
                      $ref: '#/components/schemas/PageMeta'
                  required:
                  - data
                  - pagination
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 부재 또는 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 허용되지 않은 접근
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-filtering-status: 원문 조건 외 ID 선택은 편집 대상 식별을 위한 설계 제안. 조건 조합 방식·기본 정렬·page/size 기본값은 확인 필요. page/size는 기술 제안으로 명시 전달한다.
      security:
      - bearerAuth: []
      x-roles:
      - 'OQ-AUTH-001: 관리 권한 보유자(역할 코드 승인 대기)'
      x-authorization-status: 설계 제안; 실제 인증·역할 코드·scope는 OQ-AUTH-001 승인 필요
      x-history-reference: listOrganizationRelationHistory는 이전 parent_code와 valid_from/valid_to를 반환한다.
    put:
      operationId: saveOrganizationRelation
      summary: 조직 관리 저장
      x-related-requirements:
      - REQ-006
      - REQ-008
      - REQ-007
      - REQ-047
      x-implementation-constraints:
      - canonical_id: REQ-047
        description: 이 저장 operation의 실행·영속성 설계는 plan.md의 exact marker+JSON block을 보존하고 생성된 9개 문서의 semantic SSOT로 확정한다는 원문 제약을 따른다. spec.md에 명시된 imperative/mybatis/blocking 결정을 투영하며 marker의 실제 문자열은 허용 입력에 없어 확인 필요다. 이 operation이 plan.md를 수정하거나 검증 결과를 반환하지는 않는다.
        source: requirement-registry.json의 REQ-047 statement 및 source_locator (SPEC-REQUEST.md:125)
      x-business-rules:
      - 상위조직과 적용 시작일·종료일을 함께 저장하고 이전 관계·기간은 조회 가능하게 보존한다(REQ-006, REQ-007).
      - users.organization_code/position 및 user_role_assignments를 직접 갱신하지 않는다(REQ-008). 기간 포함·중복·순환 정책은 OQ-ORG-001.
      x-side-effects:
      - organization_relations에 상위조직·기간 관계를 기록한다. 이전 관계 행을 삭제하지 않는다.
      x-required-tests:
      - 'happy: 조직·새 상위조직·기간 전송 -> 후속 getOrganizationRelations에 새 parent_code/valid_from/valid_to가 표시된다'
      - 'auth: 승인 후 실효 거부로 결정된 주체가 /api/organizations에 저장 요청 -> 403, organizations 변경 없음 (OQ-AUTH-001 선행)'
      - 'validation: organization_code 누락 -> 400 field_errors.field=organization_code이며 organization_relations 행 증가 없음'
      - 'business: 조직 관계 변경 전후 사용자 snapshot 비교 -> users.organization_code/position와 역할 부여가 동일(REQ-008); 중복기간 거부값은 OQ-ORG-001
        승인 후 확정'
      - 'side-effect: organization_relations에 상위조직·기간 관계를 기록한다. 이전 관계 행을 삭제하지 않는다. -> DB snapshot과 후속 조회로 해당 필드 및 비간섭 테이블을
        비교한다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: 정상 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Organization'
                  required:
                  - data
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 부재 또는 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 허용되지 않은 접근
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 저장 대상 식별자를 본문에 전달하는 동기 저장 설계다. 기존 식별자는 선택 응답에서 전달하고, 신규 역할 부여·메뉴 설정의 opaque ID는 frontend 내부 UUID로 생성·재시도
        보존한다. 승인자 검증·선택 대상 조합은 관련 OQ가 해결되어야 한다. 아래 required와 400/401/403 및 ID 생성은 기술 계약 제안이다.
      security:
      - bearerAuth: []
      x-roles:
      - 'OQ-AUTH-001: 관리 권한 보유자(역할 코드 승인 대기)'
      x-authorization-status: 설계 제안; 실제 인증·역할 코드·scope는 OQ-AUTH-001 승인 필요
  /api/roles:
    get:
      operationId: listRoles
      summary: 역할 관리 조회
      x-related-requirements:
      - REQ-009
      - REQ-010
      parameters:
      - in: query
        name: page
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: size
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: role_id
        description: 역할 식별정보 조회 조건
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 정상 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Role'
                    pagination:
                      $ref: '#/components/schemas/PageMeta'
                  required:
                  - data
                  - pagination
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 부재 또는 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 허용되지 않은 접근
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-filtering-status: 원문 조건 외 ID 선택은 편집 대상 식별을 위한 설계 제안. 조건 조합 방식·기본 정렬·page/size 기본값은 확인 필요. page/size는 기술 제안으로 명시 전달한다.
      security:
      - bearerAuth: []
      x-roles:
      - 'OQ-AUTH-001: 관리 권한 보유자(역할 코드 승인 대기)'
      x-authorization-status: 설계 제안; 실제 인증·역할 코드·scope는 OQ-AUTH-001 승인 필요
    put:
      operationId: saveRole
      summary: 역할 관리 저장
      x-related-requirements:
      - REQ-009
      - REQ-010
      - REQ-011
      x-business-rules:
      - role_id는 다른 역할과 식별 가능해야 한다(REQ-010).
      - purpose/grant_criteria/default_data_scope만 역할 정의로 저장하며 사용자 부여내역은 바꾸지 않는다(REQ-009, REQ-011).
      x-side-effects:
      - roles.purpose/grant_criteria/default_data_scope를 저장한다. user_role_assignments는 변경하지 않는다.
      x-required-tests:
      - 'happy: 역할 식별정보와 목적·기준·기본범위 전송 -> listRoles의 roles 필드가 저장값이다'
      - 'auth: 승인 후 실효 거부로 결정된 주체가 /api/roles에 저장 요청 -> 403, roles 변경 없음 (OQ-AUTH-001 선행)'
      - 'validation: role_id 누락 -> 400 field_errors.field=role_id이며 roles 변경 없음'
      - 'business: 역할 정의만 변경 -> user_role_assignments의 대상·role_id·기간은 변경 전과 동일(REQ-011)'
      - 'side-effect: roles.purpose/grant_criteria/default_data_scope를 저장한다. user_role_assignments는 변경하지 않는다. -> DB snapshot과
        후속 조회로 해당 필드 및 비간섭 테이블을 비교한다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: 정상 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Role'
                  required:
                  - data
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 부재 또는 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 허용되지 않은 접근
          content:
            application/json:
